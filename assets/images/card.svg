<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Arcade card for AS You Were. Colors are the light-theme tokens from style.css. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 3px; fill: #1d4ed8; }
    .title { font-size: 96px; font-weight: 800; fill: #15181d; letter-spacing: -1px; }
    .tagline { font-size: 31px; font-weight: 500; fill: #555d6b; }
    .meta { font-size: 22px; font-weight: 600; fill: #555d6b; }
    .num { font-size: 22px; font-weight: 800; text-anchor: middle; }
    .step { font-size: 27px; font-weight: 700; fill: #15181d; }
    .detail { font-size: 20px; font-weight: 500; fill: #555d6b; }
    .status { font-size: 17px; font-weight: 800; letter-spacing: 1px; text-anchor: middle; }
  </style>

  <rect width="1280" height="720" fill="#f6f7f9"/>
  <rect width="1280" height="10" fill="#1d4ed8"/>

  <!-- Left column: title and tagline -->
  <text x="72" y="236" class="eyebrow">BGP BEST-PATH · CISCO IOS</text>
  <text x="68" y="340" class="title">AS You Were</text>
  <text x="72" y="410" class="tagline">Pick the BGP path a Cisco router</text>
  <text x="72" y="452" class="tagline">installs, then see which best-path</text>
  <text x="72" y="494" class="tagline">step decided.</text>
  <text x="72" y="584" class="meta">3 levels · 6 rounds · browser game</text>

  <!-- Right column: five-step ladder -->
  <path d="M752 194V208M752 296V310M752 398V412M752 500V514" stroke="#d4d8df" stroke-width="4"/>

  <!-- 1 Weight: tie -->
  <g>
    <rect x="712" y="106" width="496" height="88" rx="8" fill="#ffffff" stroke="#d4d8df" stroke-width="2"/>
    <circle cx="752" cy="150" r="20" fill="#ffffff" stroke="#3f4a5a" stroke-width="3"/>
    <text x="752" y="158" class="num" fill="#3f4a5a">1</text>
    <text x="790" y="144" class="step">Weight</text>
    <text x="790" y="174" class="detail">A 0 = B 0</text>
    <rect x="1086" y="134" width="98" height="32" rx="4" fill="none" stroke="#3f4a5a" stroke-width="2"/>
    <text x="1135" y="156" class="status" fill="#3f4a5a">TIE</text>
  </g>

  <!-- 2 Local preference: decides -->
  <g>
    <rect x="712" y="208" width="496" height="88" rx="8" fill="#e7f5ec" stroke="#0f6b35" stroke-width="4"/>
    <circle cx="752" cy="252" r="20" fill="#0f6b35"/>
    <text x="752" y="260" class="num" fill="#ffffff">2</text>
    <text x="790" y="246" class="step">Local preference</text>
    <text x="790" y="276" class="detail" fill="#0f6b35">A 150 &gt; B 100</text>
    <rect x="1066" y="236" width="118" height="32" rx="4" fill="#0f6b35"/>
    <text x="1125" y="258" class="status" fill="#ffffff">DECIDES</text>
  </g>

  <!-- 3–5: not reached -->
  <g opacity="0.75">
    <rect x="712" y="310" width="496" height="88" rx="8" fill="#ffffff" stroke="#d4d8df" stroke-width="2"/>
    <circle cx="752" cy="354" r="20" fill="#ffffff" stroke="#555d6b" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="752" y="362" class="num" fill="#555d6b">3</text>
    <text x="790" y="348" class="step">AS-path</text>
    <text x="790" y="378" class="detail">shorter wins</text>
    <rect x="1036" y="338" width="148" height="32" rx="4" fill="none" stroke="#555d6b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1110" y="360" class="status" fill="#555d6b">NOT REACHED</text>

    <rect x="712" y="412" width="496" height="88" rx="8" fill="#ffffff" stroke="#d4d8df" stroke-width="2"/>
    <circle cx="752" cy="456" r="20" fill="#ffffff" stroke="#555d6b" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="752" y="464" class="num" fill="#555d6b">4</text>
    <text x="790" y="450" class="step">Origin</text>
    <text x="790" y="480" class="detail">i &lt; e &lt; ?</text>
    <rect x="1036" y="440" width="148" height="32" rx="4" fill="none" stroke="#555d6b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1110" y="462" class="status" fill="#555d6b">NOT REACHED</text>

    <rect x="712" y="514" width="496" height="88" rx="8" fill="#ffffff" stroke="#d4d8df" stroke-width="2"/>
    <circle cx="752" cy="558" r="20" fill="#ffffff" stroke="#555d6b" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="752" y="566" class="num" fill="#555d6b">5</text>
    <text x="790" y="552" class="step">MED</text>
    <text x="790" y="582" class="detail">lower wins</text>
    <rect x="1036" y="542" width="148" height="32" rx="4" fill="none" stroke="#555d6b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1110" y="564" class="status" fill="#555d6b">NOT REACHED</text>
  </g>
</svg>
